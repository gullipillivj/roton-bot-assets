<!DOCTYPE html>                                  <html>
<head>
  <title>RoTon Bot</title>                         <style>
    body { font-family: Arial; margin: 40px; background-color: #0F172A; }
    input, button, select { margin: 8px; padding: 10px; font-size: 15px; border-radius: 6px; }
    #logPanel { width: 100%; height: 200px; font-family: monospace; }                                 .rounded-textbox { border-radius: 8px; border: 2px solid #ccc; padding: 10px 15px; font-size: 16px; outline: none; width: 250px; }
    .rounded-textbox:focus { border-color: #007BFF; }
    .status-label { margin-top: 12px; font-weight: bold; color: #00FF00; }
    .section-box { background-color:#1E293B; padding:20px; border-radius:10px; margin-bottom:20px; }
                                                     /* 🌟 UPDATED: High-Priority CSS Floating Overlay Layout */
    .hidden-pipeline-form {
        display: none;
        position: fixed;        /* Detaches container from standard page layout flow */                                                       top: 50%;               /* Centers vertically relative to screen view */
        left: 50%;              /* Centers horizontally relative to screen view */
        transform: translate(-50%, -50%); /* Locks perfectly in screen dead-center */                                                         z-index: 99999;         /* Forces selection block to sit in front of all text elements */
        background-color: #1E293B;
        padding: 30px;
        border-radius: 12px;
        border: 2px solid #334155;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.6); /* Adds clear background separation depth */
        width: 90%;
        max-width: 400px;
        text-align: center;
    }

    /* Dark mask layout background to pull focus onto the connection modal */
    .pipeline-backdrop {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(15, 23, 42, 0.85); /* Dimming overlay parameter matrix */
        z-index: 99998; /* Sits exactly one layer behind the floating selection container */
    }
  </style>

  <script>
  function logToPanel(msg) {
      const panel = document.getElementById("logPanel");
      if (panel) {
          panel.innerText += msg + "\n";
          panel.scrollTop = panel.scrollHeight;
      } else {
          console.log(msg);
      }
  }
  window.logToPanel = logToPanel;
  </script>

</head>
<body>




  <div class="section-box">
    <label id="currentUserLabel" style="color:white">Current User:</label><br>
    <label id="currentWalletLabel" style="color:white">Wallet Address:</label><br>
    <label id="currentWalletName" style="color:white">Wallet Name:</label><br><br>


    <!-- 🟢 UPDATED: Changed to an anchor tag with your Cloudflare deployment URL -->
<a id="connectwalletBtn"
   href="https://still-violet-a9bf.gullipillivijaybhaskar.workers.dev/"
   target="_blank"
   class="rounded-textbox"
   style="background-color:#dc3545; color:white; display:inline-block; text-align:center; text-decoration:none; line-height:normal; padding: 10px 20px;">
   Connect Wallet
</a>



  </div>



  <div class="section-box">
    <label style="color:white">Starting Balance (Raw Uint256 Wei):</label><br>
    <input id="startBalance" name="startBalance" type="text" value="{{ starting_balance_wei if starting_balance_wei else '0' }}" class="rounded-textbox" style="background-color:#0F172A;color:yellow" readonly><br>
    <button id="transactionBtn" class="rounded-textbox" style="background-color:#f3ba2f;color:black;">Transaction</button><br>

    <label style="color:white">Usd \$:</label><br>
    <input id="usd" type="number" value="" class="rounded-textbox" style="background-color:#0F172A;color:yellow" readonly><br>

    <label style="color:white">Investment Balance:</label><br>
    <input id="investBalance" type="number" value="500" class="rounded-textbox" style="background-color:#0F172A;color:yellow" readonly ><br>

    <label style="color:white">Profit Target (%):</label><br>
    <input id="profitTarget" type="number" value="1" class="rounded-textbox" style="background-color:#0F172A;color:yellow"><br>

    <label style="color:white">Stop Loss (%):</label><br>
    <input id="stopLoss" type="number" value="0.5" class="rounded-textbox" style="background-color:#0F172A;color:yellow"><br>
  </div>

  <div class="section-box">
    <label style="color:white">Select Token:</label><br>
    <select id="tokenSelect" class="rounded-textbox" style="background-color:#0F172A;color:yellow">
      <option value="0x55d398326f99059fF775485246999027B3197955">USDT</option>
      <option value="bnb">BNB</option>
      <option value="eth">ETH</option>
    </select><br><br>

    <label style="color:white">Deposit Amount</label><br>
    <input id="depositAmount" type="number" class="rounded-textbox" style="background-color:#0F172A;color:yellow" />
    <button id="depositBtn" class="rounded-textbox" style="background-color:#007BFF;color:white;">Deposit</button><br>

    <label style="color:white">Withdraw Amount</label><br>
    <input id="withdrawAmount" type="number" class="rounded-textbox" style="background-color:#0F172A;color:yellow" />
    <button id="withdrawBtn" class="rounded-textbox" style="background-color:#6f42c1;color:white;">Withdraw</button>
  </div>

  <div class="section-box">
    <button id="startBtn" class="rounded-textbox" style="background-color:green;color:white;">Start Trading</button>
    <button id="stopBtn" class="rounded-textbox" style="background-color:red;color:white;">Stop Trading</button>
    <button id="logoutBtn" class="rounded-textbox" style="background-color:#dc3545;color:white;">Logout</button>
  </div>

  <h4 style="color:white">Logs will appear here...</h4>
  <div id="logPanel" style="width:100%;height:200px;font-family:monospace;color:yellow;background-color:#0F172A;overflow-y:auto;white-space:pre-wrap;">
  Logs will appear here...
  </div>

  <div id="liveProfitBox" style="color:white; font-size:18px; margin-top:10px;">
    Live Profit: <span id="liveProfitValue" style="color:#f3ba2f;">0.00 USDT</span>
  </div>

  <canvas id="balanceChart" width="500" height="140" style="border:1px solid #FFF;"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Chart initialization -->
  <script>
  const ctx = document.getElementById("balanceChart").getContext("2d");
  window.balanceChart = new Chart(ctx, {
      type: "bar",
      data: {
          labels: [],
          datasets: [
              { label: "Investment Balance", borderColor: "#f3ba2f", data: [] },
              { label: "Profit/Loss", borderColor: "#00FF00", data: [] }
          ]
      },
      options: { responsive: true }
  });
  </script>







  <!-- Assets -->
  <script>{{ coins_js|safe }}</script>
  <script>{{ chart_js|safe }}</script>
  <script>{{ pancake_js|safe }}</script>
  <script>{{ simulate_js|safe }}</script>
  <script>{{ main_js|safe }}</script>
</body>
</html>
